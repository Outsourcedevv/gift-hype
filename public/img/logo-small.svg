    <radialGradient id="ub-glow" cx=".5" cy=".58" r=".55"><stop offset="0" stop-color="#8b6cff" stop-opacity=".55"/><stop offset=".6" stop-color="#5d8bff" stop-opacity=".12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="ub-mark" x1="0" y1="1" x2=".9" y2="0"><stop offset="0" stop-color="#9b7bff"/><stop offset=".55" stop-color="#6aa0ff"/><stop offset="1" stop-color="#3ee8ff"/></linearGradient>
