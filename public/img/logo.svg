<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ub-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1442"/><stop offset=".55" stop-color="#0d0b22"/><stop offset="1" stop-color="#071a2a"/></linearGradient>
    <radialGradient id="ub-glow" cx=".5" cy=".58" r=".55"><stop offset="0" stop-color="#8b6cff" stop-opacity=".55"/><stop offset=".6" stop-color="#5d8bff" stop-opacity=".12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="ub-mark" x1="0" y1="1" x2=".9" y2="0"><stop offset="0" stop-color="#9b7bff"/><stop offset=".55" stop-color="#6aa0ff"/><stop offset="1" stop-color="#3ee8ff"/></linearGradient>
    <linearGradient id="ub-ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ee8ff"/><stop offset=".5" stop-color="#a48bff" stop-opacity=".9"/><stop offset="1" stop-color="#3ee8ff" stop-opacity=".25"/></linearGradient>
    <filter id="ub-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#ub-tile)"/>
  <rect width="120" height="120" rx="28" fill="url(#ub-glow)"/>
  <rect x=".75" y=".75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="1.5"/>
  <!-- the broken orbit: open at the top right, where the arrow breaks out -->
  <g transform="rotate(-18 60 70)">
    <path d="M86.6 58.4 A40 15 0 1 1 52 55.4" fill="none" stroke="url(#ub-ring)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M95.5 65.5 A40 15 0 0 1 100 69" fill="none" stroke="#3ee8ff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- glow, then the mark: a U whose right side launches up as an arrow -->
  <path d="M40 42V67a20 20 0 0 0 40 0V26M67 39L80 26L93 39" fill="none" stroke="url(#ub-mark)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#ub-blur)" opacity=".85"/>
  <path d="M40 42V67a20 20 0 0 0 40 0V26M67 39L80 26L93 39" fill="none" stroke="url(#ub-mark)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a spark where it breaks out -->
  <path d="M99 16l1.6 4.4L105 22l-4.4 1.6L99 28l-1.6-4.4L93 22l4.4-1.6z" fill="#fff"/>
</svg>
