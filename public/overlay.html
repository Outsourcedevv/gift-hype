<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unbound overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --accent: #25f4ee; --pink: #fe2c55; --amber: #fbbf24; }
/* Minecraft-style lettering: Monocraft (SIL Open Font License, github.com/IdreesInc/Monocraft) */
@font-face { font-family: 'Monocraft'; src: url('/fonts/Monocraft.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Monocraft'; src: url('/fonts/Monocraft-Bold.ttf') format('truetype'); font-weight: 700; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; color: #fff; }
/* Everything is drawn on a stage of a fixed size (1920 x 1080, or 1080 x 1920 for a portrait stream) that's
   scaled to fit the browser source, so it looks the same as in the app's editor whatever size the source is.
   (Its transform also makes it what the boxes' "fixed" places are measured from.) */
#stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
/* Popups stack in a column; position and size come from the app's settings. */
#stack { position: absolute; left: 50%; top: 40px; width: 760px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.pop.demo, .pop.demo * { animation: none !important; }
.pop {
  display: flex; align-items: center; gap: 18px; padding: 14px 26px 14px 14px; border-radius: 22px;
  background: rgba(14, 16, 19, .86); border: 2px solid var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), 0 12px 40px rgba(0, 0, 0, .5);
  animation: in .45s cubic-bezier(.2, 1.6, .4, 1) both;
  max-width: 900px;
}
.pop.out { animation: out .4s ease forwards; }
.pop .img { width: 84px; height: 84px; flex: none; display: grid; place-items: center; font-size: 56px; animation: wiggle 1.2s ease-in-out infinite; }
.pop .img img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
.pop .who { font-size: 26px; font-weight: 700; }
.pop .who b { color: var(--accent); }
.pop .who .n { font-family: 'JetBrains Mono', monospace; color: var(--amber); }
.pop .did { font-size: 22px; color: var(--pink); font-weight: 700; margin-top: 2px; }
@keyframes in { from { transform: translateY(-30px) scale(.7); opacity: 0; } }
/* the popups' look and movement (Overlay → Gift popups in the app) */
.pop { color: var(--pop-text, #fff); }
.pop .who b { color: var(--pop-name, var(--accent)); }
body.anim-slide .pop { animation: slideIn .45s cubic-bezier(.2, 1.2, .4, 1) both; }
body.anim-zoom .pop { animation: zoomIn .4s cubic-bezier(.2, 1.8, .4, 1) both; }
body.anim-fade .pop { animation: fadeIn .5s ease both; }
body.anim-spin .pop { animation: spinIn .6s cubic-bezier(.2, 1.4, .4, 1) both; }
body.anim-none .pop { animation: none; }
body.anim-none .pop.out { animation: fadeOut .2s ease forwards; }
body.no-wiggle .pop .img { animation: none; }
@keyframes slideIn { from { transform: translateX(-120%); opacity: 0; } }
@keyframes zoomIn { from { transform: scale(2.2); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes spinIn { from { transform: rotate(-200deg) scale(.2); opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
body.pst-light .pop { background: rgba(255, 255, 255, .94); color: var(--pop-text, #14171c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), 0 12px 40px rgba(0, 0, 0, .35); }
body.pst-glass .pop { background: rgba(255, 255, 255, .14); backdrop-filter: blur(14px) saturate(1.4); border-color: rgba(255, 255, 255, .55); }
body.pst-glass .pop .who, body.pst-glass .pop .did { text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
body.pst-neon .pop { background: rgba(4, 4, 12, .9); box-shadow: 0 0 18px var(--accent), 0 0 40px color-mix(in srgb, var(--accent) 60%, transparent), inset 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); }
body.pst-neon .pop .who, body.pst-neon .pop .did { text-shadow: 0 0 10px currentColor; }
body.pst-minecraft .pop { font-family: 'Monocraft', monospace; border-radius: 0; background: rgba(16, 16, 16, .88); border: 4px solid #3f3f3f; box-shadow: inset -4px -4px 0 #1c1c1c, inset 4px 4px 0 #5a5a5a, 0 10px 30px rgba(0, 0, 0, .5); }
@keyframes out { to { transform: translateY(-20px) scale(.9); opacity: 0; } }
@keyframes wiggle { 0%, 100% { transform: rotate(-6deg) scale(1); } 50% { transform: rotate(6deg) scale(1.08); } }
/* During a reset: the gift that saves you floats round the middle of the screen. Three slow movements
   at different speeds (a loop round, a bob up and down, a little tilt) so it never looks repeated */
#saveFloat { position: absolute; left: 50%; top: 46%; width: 0; height: 0; pointer-events: none; z-index: 5; }
#saveFloat .loop { animation: sfLoop 9s linear infinite; }
#saveFloat .bob { animation: sfBob 2.6s ease-in-out infinite alternate; }
#saveFloat .tilt { animation: sfTilt 3.4s ease-in-out infinite alternate; transform-origin: 50% 50%; }
#saveFloat .card { position: absolute; left: -230px; top: -150px; width: 460px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  animation: sfIn .6s cubic-bezier(.2,1.4,.4,1); }
#saveFloat .card.out { animation: sfOut .5s ease forwards; }
#saveFloat .card.saved { animation: sfSaved .9s cubic-bezier(.2,1.2,.4,1) forwards; }
#saveFloat .glow { position: absolute; left: 50%; top: 110px; width: 280px; height: 280px; margin: -140px 0 0 -140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(37,244,238,.45), rgba(37,244,238,0) 65%); animation: sfPulse 1.4s ease-in-out infinite alternate; }
#saveFloat img { position: relative; width: 220px; height: 220px; object-fit: contain; filter: drop-shadow(0 8px 24px rgba(0,0,0,.55)); }
#saveFloat .say { position: relative; font-weight: 800; font-size: 30px; text-align: center; color: #fff; text-shadow: 0 3px 0 #000, 0 0 18px rgba(0,0,0,.7); letter-spacing: .02em; }
#saveFloat .say b { color: var(--accent); }
#saveFloat .secs { position: relative; margin-top: 4px; padding: 4px 22px; border-radius: 999px; background: rgba(20,4,10,.85); border: 3px solid var(--pink);
  font-weight: 800; font-size: 44px; line-height: 1.1; color: #fff; font-variant-numeric: tabular-nums; box-shadow: 0 0 22px rgba(254,44,85,.5); }
#saveFloat .secs.urgent { color: var(--pink); animation: throb .5s ease-in-out infinite alternate; }
@keyframes sfLoop { 0% { transform: translate(60px, 0); } 25% { transform: translate(0, 34px); } 50% { transform: translate(-60px, 0); } 75% { transform: translate(0, -34px); } 100% { transform: translate(60px, 0); } }
@keyframes sfBob { from { transform: translateY(-38px); } to { transform: translateY(38px); } }
@keyframes sfTilt { from { transform: rotate(-7deg) scale(.97); } to { transform: rotate(7deg) scale(1.04); } }
@keyframes sfPulse { from { transform: scale(.85); opacity: .7; } to { transform: scale(1.1); opacity: 1; } }
@keyframes sfIn { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
@keyframes sfOut { to { opacity: 0; transform: scale(.4); } }
@keyframes sfSaved { 30% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1.6) translateY(-80px); opacity: 0; } }
/* The Dropper's gift popup: the gift on spinning sun rays, the sender's name big, what they did under it */
.burst { position: relative; display: flex; flex-direction: column; align-items: center; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; pointer-events: none; }
.burst.out { animation: out .4s ease forwards; }
.burst .sun { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
.burst .rays { position: absolute; inset: -40px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 214, 90, .95) 0deg 9deg, rgba(255, 214, 90, 0) 9deg 22.5deg);
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%);
  animation: spin 6s linear infinite; }
.burst .glow { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 160, .95), rgba(255, 190, 60, 0) 70%); }
.burst .sun img { position: relative; width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,.45)); animation: bob 1.2s ease-in-out infinite; }
.burst .name { font-family: 'Monocraft', 'Silkscreen', monospace; font-weight: 700; font-size: 46px; color: #ffcf3a; letter-spacing: 1px; margin-top: -6px;
  text-shadow: 3px 3px 0 #5a3a00, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 18px rgba(255, 190, 40, .55); }
.burst .what { font-family: 'Monocraft', 'Silkscreen', monospace; font-size: 24px; margin-top: 2px; text-shadow: 2px 2px 0 #000; }
.burst .what.red { color: #ff5a5a; } .burst .what.green { color: #6cff7a; } .burst .what.aqua { color: #6ff4ff; } .burst .what.yellow { color: #ffe066; } .burst .what.white { color: #fff; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.06); } }

/* The level slot machine */
#slots { position: absolute; left: 50%; top: 50%; transform-origin: center; display: none; }
#slots.on { display: block; }
.slot { width: 420px; padding: 16px 18px 18px; border-radius: 22px; text-align: center; font-family: 'Monocraft', monospace;
  background: linear-gradient(#2a1608, #170b03); border: 6px solid #f5b81e; box-shadow: 0 0 0 4px #7a4a00, 0 0 40px rgba(255, 190, 40, .55), inset 0 0 30px rgba(0,0,0,.6);
  animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; position: relative; }
.slot.out { animation: out .4s ease forwards; }
.slot .bulbs { position: absolute; inset: 6px; border-radius: 14px; pointer-events: none;
  background: radial-gradient(circle, #fff6c2 0 3px, transparent 4px) 0 0 / 22px 22px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 6px; animation: chase .5s steps(2) infinite; }
.slot .head { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
.slot .head img { width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
.slot .title { font-weight: 700; font-size: 26px; color: #ffd84a; text-shadow: 3px 3px 0 #3f2d00; letter-spacing: 1px; }
.slot .by { font-size: 17px; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; }
.slot .window { position: relative; height: 270px; overflow: hidden; border-radius: 12px; background: linear-gradient(#0c0c0c, #262626 30%, #262626 70%, #0c0c0c); border: 4px solid #5b3a0a; }
.slot .strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.slot .item { height: 90px; display: grid; place-items: center; font-weight: 700; font-size: 64px; }
.slot .plus { color: #55ff55; text-shadow: 5px 5px 0 #153f15; }
.slot .minus { color: #ff5555; text-shadow: 5px 5px 0 #3f1515; }
.slot .band { position: absolute; left: 0; right: 0; top: 90px; height: 90px; border-top: 3px solid rgba(255, 216, 74, .85); border-bottom: 3px solid rgba(255, 216, 74, .85); box-shadow: 0 0 20px rgba(255, 216, 74, .35) inset; pointer-events: none; }
.slot .band::before, .slot .band::after { content: ''; position: absolute; top: 50%; margin-top: -14px; border: 14px solid transparent; }
.slot .band::before { left: 2px; border-left-color: #ffd84a; }
.slot .band::after { right: 2px; border-right-color: #ffd84a; }
.slot .shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.65), transparent 32%, transparent 68%, rgba(0,0,0,.65)); pointer-events: none; }
.slot .result { height: 44px; margin-top: 12px; font-weight: 700; font-size: 34px; opacity: 0; }
.slot.done .result { opacity: 1; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
.slot.done .win { animation: flash .35s steps(2) 4; }
@keyframes chase { to { background-position: 11px 0; } }
@keyframes flash { 50% { opacity: .25; } }

/* The reset countdown (as in Parkour Paradise): which gift saves you */
#resetBox { position: absolute; left: 40px; top: 40px; width: var(--bw, 420px); transform-origin: top left; }
#resetBox:empty { display: none; }
.reset { border-radius: 16px; padding: 14px 18px 16px; background: rgba(20, 4, 10, .88); border: 3px solid var(--pink); box-shadow: 0 0 30px rgba(254,44,85,.45); animation: in .45s cubic-bezier(.2,1.4,.4,1); }
.reset.urgent { animation: in .45s cubic-bezier(.2,1.4,.4,1), throb .5s ease-in-out infinite alternate; }
.reset .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.reset .label { font-weight: 700; font-size: 20px; letter-spacing: .06em; color: var(--pink); text-transform: uppercase; }
.reset .num { font-weight: 700; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(254,44,85,.6); }
.reset .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); margin: 10px 0 12px; overflow: hidden; }
.reset .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), #ff8a3d); transition: width .3s linear; }
.reset .save { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; }
.reset .save .pic { width: 56px; height: 56px; flex: none; animation: wiggle 1.2s ease-in-out infinite; }
.reset .save .pic img { width: 100%; height: 100%; object-fit: contain; }
.reset .save b { color: var(--accent); }
.reset.result { border-color: var(--accent); box-shadow: 0 0 30px rgba(37,244,238,.4); text-align: center; animation: in .45s cubic-bezier(.2,1.4,.4,1), out .4s ease 3.6s forwards; }
.reset.result.bad { border-color: var(--pink); box-shadow: 0 0 30px rgba(254,44,85,.45); }
.reset.result .num { font-size: 40px; }
.reset.result .who { font-size: 17px; margin-top: 4px; }
@keyframes throb { to { transform: scale(1.04); box-shadow: 0 0 46px rgba(254,44,85,.8); } }
/* Chat block delete: blocks typed in chat, each with its countdown (top right) */
#chatDel { position: absolute; right: 40px; top: 40px; width: var(--bw, 380px); transform-origin: top right; display: flex; flex-direction: column; gap: 10px; font-family: 'Monocraft', monospace; }
.cd { position: relative; padding: 10px 14px 12px; background: rgba(12, 12, 12, .86); border: 3px solid #3f3f3f; border-radius: 4px;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.5), inset 3px 3px 0 rgba(255,255,255,.12), 0 6px 20px rgba(0,0,0,.45); animation: in .4s cubic-bezier(.2,1.4,.4,1) both; }
.cd .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cd .name { font-weight: 700; font-size: 24px; color: #ff5555; text-shadow: 3px 3px 0 #3f1515; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd .num { font-weight: 700; font-size: 30px; color: #fff; text-shadow: 3px 3px 0 #3f3f3f; font-variant-numeric: tabular-nums; }
.cd .by { font-size: 15px; color: #aaa; text-shadow: 2px 2px 0 #2a2a2a; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd .bar { height: 10px; margin-top: 8px; background: #2a2a2a; border: 2px solid #111; }
.cd .bar i { display: block; height: 100%; background: linear-gradient(#ff7a7a, #c01f1f); transition: width 1s linear; }
.cd.urgent { border-color: #ff5555; animation: in .4s cubic-bezier(.2,1.4,.4,1) both, throbcd .5s ease-in-out infinite alternate; }
.cd.gone { border-color: #ff5555; text-align: center; animation: in .4s cubic-bezier(.2,1.4,.4,1) both, out .4s ease 3.6s forwards; }
.cd.gone .name { font-size: 26px; white-space: normal; }
.cd.gone .by { color: #fff; }
@keyframes throbcd { to { box-shadow: 0 0 26px rgba(255,85,85,.7); } }
/* Chunk Chat: the block that's winning, the timer, and the top picks */
#chunkChat { position: absolute; right: 40px; top: 40px; width: var(--bw, 400px); transform-origin: top right; font-family: 'Monocraft', monospace; }
#chunkChat:empty { display: none; }
.cc { padding: 12px 16px 14px; background: rgba(12, 12, 12, .88); border: 3px solid #3f3f3f; border-radius: 4px;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.5), inset 3px 3px 0 rgba(255,255,255,.12), 0 6px 20px rgba(0,0,0,.45); animation: in .4s cubic-bezier(.2,1.4,.4,1) both; }
.cc .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cc .tag { font-weight: 700; font-size: 18px; color: #55ff55; text-shadow: 2px 2px 0 #153f15; letter-spacing: 1px; }
.cc .num { font-weight: 700; font-size: 34px; color: #fff; text-shadow: 3px 3px 0 #3f3f3f; font-variant-numeric: tabular-nums; }
.cc .block { font-weight: 700; font-size: 30px; line-height: 1.15; color: #55ff55; text-shadow: 3px 3px 0 #153f15; margin-top: 2px; overflow-wrap: anywhere; }
.cc .block.long { font-size: 22px; }
.cc .block.none { color: #ffff55; text-shadow: 3px 3px 0 #3f3f15; font-size: 22px; white-space: normal; }
.cc .by { font-size: 15px; color: #aaa; text-shadow: 2px 2px 0 #2a2a2a; margin-top: 2px; }
.cc .bar { height: 10px; margin-top: 8px; background: #2a2a2a; border: 2px solid #111; }
.cc .bar i { display: block; height: 100%; background: linear-gradient(#7dff7d, #1f9c1f); transition: width 1s linear; }
.cc .top { margin-top: 8px; display: grid; gap: 3px; font-size: 15px; color: #ddd; }
.cc .top div { display: flex; justify-content: space-between; text-shadow: 2px 2px 0 #222; }
.cc.urgent { border-color: #55ff55; }
.cc.done { border-color: #55ff55; text-align: center; animation: in .4s cubic-bezier(.2,1.4,.4,1) both; }
.cc.done .block { font-size: 32px; white-space: normal; }
body.preview { background: repeating-conic-gradient(#20242b 0 25%, #171a1f 0 50%) 0 0 / 40px 40px; }

/* the gift list: what each gift does in the game you're playing (Unbound fills it in). Its place,
   size and colours come from the settings (--m-* below, set by drawMenu). */
#menu { position: fixed; left: var(--m-x, 2%); top: var(--m-y, 50%); transform: translate(calc(var(--m-x, 2%) * -1), calc(var(--m-y, 50%) * -1)) scale(var(--m-scale, 1));
  transform-origin: var(--m-x, 2%) var(--m-y, 50%); width: var(--bw, 330px); min-height: var(--bh, 0px); display: none; transition: opacity .4s;
  background: var(--m-bg, rgba(10, 18, 34, .78)); border: 2px solid var(--m-border, #3a4a66); border-radius: 16px; padding: 14px 14px 10px; color: var(--m-name, #fff);
  font-family: 'Monocraft', 'Silkscreen', monospace; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
#menu.on { display: block; }
#menu.away { opacity: 0; }
#menu .t { font-weight: 700; font-size: 20px; letter-spacing: 1px; color: var(--m-title, #ffcf3a); text-align: center; margin-bottom: 8px; text-shadow: 2px 2px 0 #000; }
#menu .row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-top: 1px solid rgba(255, 255, 255, .08); border-radius: 8px; animation: menuIn .35s ease both; transition: background .3s, box-shadow .3s; }
#menu .row img { width: 44px; height: 44px; object-fit: contain; flex: none; }
#menu .row .nm { font-size: 14px; font-weight: 700; line-height: 1.15; color: var(--m-name, #fff); }
#menu .c { color: var(--m-price, #ffcf3a); }
#menu .row .c { font-size: 12px; }
#menu .d { color: var(--m-does, #9fe7ff); }
#menu .row .d { font-size: 13px; line-height: 1.2; margin-top: 2px; }
#menu .pg { text-align: center; font-size: 11px; opacity: .6; margin-top: 4px; }
/* a gift that was just sent */
#menu .row.lit { background: rgba(255, 207, 58, .22); box-shadow: 0 0 0 2px var(--m-title, #ffcf3a) inset; animation: litPulse .6s ease 3; }
#menu.single.lit { box-shadow: 0 0 0 3px var(--m-title, #ffcf3a), 0 0 30px var(--m-title, #ffcf3a); }
@keyframes litPulse { 50% { transform: scale(1.04); } }
/* one at a time: a big card for one gift, then the next */
#menu.single { width: var(--bw, 300px); text-align: center; padding: 14px 16px 12px; }
#menu.single .one { animation: oneIn .5s ease both; }
#menu.single .one img { width: 120px; height: 120px; object-fit: contain; display: block; margin: 2px auto 6px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
#menu.single .one .nm { font-size: 22px; font-weight: 700; line-height: 1.1; }
#menu.single .one .c { font-size: 16px; margin-top: 4px; }
#menu.single .one .d { font-size: 18px; margin-top: 8px; line-height: 1.2; }
#menu.single .dots { display: flex; justify-content: center; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
#menu.single .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
#menu.single .dots i.on { background: var(--m-title, #ffcf3a); }
/* is the overlay reaching Unbound? a moment's "connected", or a notice that stays while it can't */
#conn { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; font: 700 15px 'Monocraft', monospace;
  color: #fff; background: rgba(10, 18, 34, .8); border: 2px solid #4ade80; opacity: 0; transition: opacity .4s; pointer-events: none; }
#conn.show { opacity: 1; }
#conn.bad { border-color: #f87171; }
/* each box's own width and height (Overlay → Boxes in the app): the words fit and stay in the middle */
#stack .pop { width: var(--bw, auto); max-width: max(900px, var(--bw, 0px)); min-height: var(--bh, 0px); box-sizing: border-box; justify-content: center; }
#stack .pop > div:last-child { min-width: 0; }

<body class="top">
<div id="stage">
<div id="stack"></div>
<div id="resetBox"></div>
<div id="saveFloat"></div>
<div id="slots"></div>
<div id="chatDel"></div>
<div id="chunkChat"></div>
<div id="menu"></div>
<div id="ccReveal"></div>
<div id="conn"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pic = url => !url ? '' : url.startsWith('/') ? url : '/gift-img?u=' + encodeURIComponent(url);
let settings = { overlay: { position: 'top', scale: 1, showSender: true }, soundsIn: 'app' };
const EDITING = new URLSearchParams(location.search).has('edit');
// the part of each box that takes the width and height (popups: one popup; lists: one entry)
const PANEL = { popups: '#stack .pop', menu: '#menu', timer: '#chunkChat .cc', chatdel: '#chatDel .cd', reset: '#resetBox .reset' };
const DEMO_ROSE = 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp';
if (location.search.includes('preview')) document.body.classList.add('preview');

// the stage's shape: the app's setting, or (auto) the shape of the browser source
function stageShape() {
  const c = settings.overlay && settings.overlay.canvas;
  return c === 'portrait' || c === 'landscape' ? c : innerHeight > innerWidth ? 'portrait' : 'landscape';
}
// Auto (the standard): the overlay is the browser source's own size and everything is drawn at its real
// size (the app's editor takes that same size). Landscape / Portrait: a 1920 x 1080 / 1080 x 1920 stage
// scaled to fit the source.
function fitStage() {
  const st = document.getElementById('stage'), c = settings.overlay && settings.overlay.canvas;
  if (c !== 'landscape' && c !== 'portrait') {
    st.style.width = innerWidth + 'px'; st.style.height = innerHeight + 'px';
    st.style.transform = 'translate(0px, 0px)';   // still a transform: the boxes' places are measured from the stage
    return;
  }
  const portrait = c === 'portrait', W = portrait ? 1080 : 1920, H = portrait ? 1920 : 1080, k = Math.min(innerWidth / W, innerHeight / H);
  st.style.width = W + 'px'; st.style.height = H + 'px';
  st.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`;
}
// tell the app how big the overlay is in the streaming app (not from the editor)
let viewTimer = null;
function reportView() {
  if (EDITING) return;
  clearTimeout(viewTimer);
  viewTimer = setTimeout(() => fetch(`/api/overlay/view?w=${innerWidth}&h=${innerHeight}`).catch(() => {}), 400);
}
addEventListener('resize', () => { fitStage(); reportView(); });
function applySettings() {
  // main colour for the border and sender, eye-catcher for what the gift does
  const o = settings.overlay, look = settings.look || {};
  const th = o.popColors ? [o.popBorder, o.popDoes]
    : settings.theme === 'custom' ? [look.main || '#7c4dff', look.hot || '#ff2d75']
    : { unbound: ['#8b6cff', '#22d3ee'], sky: ['#4db3ee', '#ff6a3d'], blaze: ['#ff4500', '#ffd000'], punk: ['#3b82f6', '#00f0a8'], egyptian: ['#3a5ce0', '#ff2400'], mint: ['#10b981', '#f472b6'], grape: ['#8b5cf6', '#facc15'], mono: ['#e5e7eb', '#ef4444'] }[settings.theme] || ['#8b6cff', '#22d3ee'];
  document.documentElement.style.setProperty('--accent', th[0]);
  document.documentElement.style.setProperty('--pink', th[1]);
  const st = document.documentElement.style;
  if (o.popColors) { st.setProperty('--pop-name', o.popName); st.setProperty('--pop-text', o.popText); } else { st.removeProperty('--pop-name'); st.removeProperty('--pop-text'); }
  if (typeof drawMenu === 'function') try { drawMenu(); } catch { }
  document.body.className = o.position + (location.search.includes('preview') ? ' preview' : '') + (EDITING ? ' editing' : '')
    + ` anim-${o.popAnim || 'bounce'} pst-${o.popStyle || 'dark'}` + (o.popWiggle === false ? ' no-wiggle' : '');
  document.getElementById('slots').style.transform = `translate(-50%, -50%) scale(${(o.scale || 1) * zoomOf()})`;
  applyPlaces();
  fitStage();
  avoidMenu();
}

const MAX = 4;
// The Dropper's popup (and any game's, with Popup type "Burst"): one big popup at a time, the gift on
// spinning sun rays, the name big and what it did under it
function burstHtml(e) {
  const o = settings.overlay, own = !e.dropper && o.popColors;
  return `<div class="sun"><div class="rays"></div><div class="glow"></div>${e.image ? `<img src="${pic(e.image)}" alt="">` : ''}</div>
    <div class="name"${own ? ` style="color:${esc(o.popName)}"` : ''}>${esc(o.showSender ? e.from : e.gift)}</div>
    <div class="what ${esc(e.actionColor || 'white')}"${own ? ` style="color:${esc(o.popDoes)}"` : ''}>${esc(e.action || e.label || '')}</div>`;
}
function burst(e) {
  const stack = document.getElementById('stack');
  stack.querySelectorAll('.burst:not(.demo)').forEach(b => b.remove());
  const el = document.createElement('div');
  el.className = 'burst';
  el.innerHTML = burstHtml(e);
  stack.prepend(el);
  avoidMenu();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, e.dropper ? 3600 : (settings.overlay.popSeconds || 4.5) * 1000);
}
function popHtml(e) {
  const o = settings.overlay, word = o.popWord ?? 'sent';
  return `${o.popImage !== false ? `<div class="img">${e.image ? `<img src="${pic(e.image)}" alt="">` : ''}</div>` : ''}
    <div><div class="who">${e.event === 'follow' ? `<b>${esc(e.from)}</b> followed!` : `${o.showSender ? `<b>${esc(e.from)}</b> ${esc(word)} ` : ''}${e.count > 1 && o.popCount !== false ? `<span class="n">${e.count}×</span> ` : ''}${esc(e.gift)}`}</div>
    ${e.label ? `<div class="did">${esc(e.label)}</div>` : ''}</div>`;
}
// Popups never cover the gift list: they move sideways to the list's open side, or else above or below it
// (measured from their places, not their animations). The list itself is never hidden for it.
function avoidMenu() {
  const st = document.getElementById('stage'), stack = document.getElementById('stack'), m = document.getElementById('menu');
  stack.style.marginLeft = stack.style.marginTop = '0px';
  if (EDITING || !m.classList.contains('on') || m.classList.contains('boxhidden') || !stack.children.length) return;
  const sr = st.getBoundingClientRect(), k = sr.width / st.offsetWidth, r = stack.getBoundingClientRect(), f = r.width / stack.offsetWidth;
  let a = null;
  for (const c of stack.children) {
    const l = r.left + c.offsetLeft * f, t = r.top + c.offsetTop * f, R = l + c.offsetWidth * f, B = t + c.offsetHeight * f;
    a = a ? { l: Math.min(a.l, l), t: Math.min(a.t, t), r: Math.max(a.r, R), b: Math.max(a.b, B) } : { l, t, r: R, b: B };
  }
  const b = m.getBoundingClientRect();
  if (!(a.l < b.right && b.left < a.r && a.t < b.bottom && b.top < a.b)) return;
  const gap = 18 * k, fitsX = d => a.l + d >= sr.left && a.r + d <= sr.right, fitsY = d => a.t + d >= sr.top && a.b + d <= sr.bottom;
  const tries = [];
  const right = b.right + gap - a.l, left = b.left - gap - a.r, down = b.bottom + gap - a.t, up = b.top - gap - a.b;
  // the smallest move that fits on the screen wins
  if (fitsX(right)) tries.push(['x', right]);
  if (fitsX(left)) tries.push(['x', left]);
  if (fitsY(down)) tries.push(['y', down]);
  if (fitsY(up)) tries.push(['y', up]);
  if (!tries.length) return;
  const [axis, d] = tries.sort((p, q) => Math.abs(p[1]) - Math.abs(q[1]))[0];
  if (axis === 'x') stack.style.marginLeft = d / k + 'px'; else stack.style.marginTop = d / k + 'px';
}
function popup(e) {
  if (e.dropper || settings.overlay.popType === 'burst') return burst(e);
  const stack = document.getElementById('stack');
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = popHtml(e);
  stack.prepend(el);
  const o = settings.overlay;
  while (stack.querySelectorAll('.pop:not(.demo)').length > (o.popMax || MAX)) [...stack.querySelectorAll('.pop:not(.demo)')].pop().remove();
  avoidMenu();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, (o.popSeconds || 4.5) * 1000);
}

const playing = new Set(), looping = new Map();
function playSound(file, volume, opts = {}) {
  if (playing.size >= 6) { const a = [...playing].find(x => !x.loop) || playing.values().next().value; a.pause(); playing.delete(a); }
  const a = new Audio('/sounds/' + file.split('/').map(encodeURIComponent).join('/') + (opts.start > 0 ? '#t=' + opts.start : ''));
  // and if the browser didn't start there by itself, it jumps there once it knows the sound
  if (opts.start > 0) a.addEventListener('loadedmetadata', () => { if (a.currentTime < opts.start - 0.05) a.currentTime = opts.start; }, { once: true });
  a.volume = Math.max(0, Math.min(1, volume));
  playing.add(a);
  a.onended = a.onerror = () => playing.delete(a);
  if (opts.loopFor) { stopSound(opts.id); a.loop = true; looping.set(opts.id, a); a._stop = setTimeout(() => stopSound(opts.id), opts.loopFor * 1000); }
  else cutAfter(a, opts.len);
  a.play().catch(() => playing.delete(a));
}
// a sound with a length stops after that many seconds, fading out over its last moment
function cutAfter(a, len) {
  if (!(len > 0)) return;
  const fade = Math.min(0.6, len / 3);
  // counted from when it really starts playing (not while it loads)
  a.addEventListener('playing', () => { const v0 = a.volume; a._cut = setTimeout(() => {
    const t0 = performance.now();
    const step = () => {
      if (a.paused) return;
      const k = Math.min(1, (performance.now() - t0) / (fade * 1000));
      a.volume = v0 * (1 - k);
      if (k < 1) requestAnimationFrame(step); else a.pause();
    };
    requestAnimationFrame(step);
  }, Math.max(0, len - fade) * 1000); }, { once: true });
}

function stopSound(id) { const a = looping.get(id); if (!a) return; clearTimeout(a._stop); a.pause(); playing.delete(a); looping.delete(id); }

// ----- the level slot machine (the Dropper) -----
// The reel spins and slows down onto the result; ticks as each number goes past, a ding at the end.
const slotQueue = [];
let slotBusy = false, audio = null;
function tick(freq = 1500, len = 0.03, vol = 0.12) {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + len);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + len);
  } catch { }
}
const fmt = n => (n > 0 ? '+' : '') + n;
function spinSlots(w) {
  if (slotBusy) return slotQueue.push(w);
  slotBusy = true;
  const box = document.getElementById('slots'), H = 90;
  // a long strip of random amounts, ending with the result in the middle of the window
  const items = Array.from({ length: 34 }, () => w.amounts[Math.floor(Math.random() * w.amounts.length)]);
  items.push(w.result, w.amounts[Math.floor(Math.random() * w.amounts.length)]);
  const end = (items.length - 3) * H;
  box.innerHTML = `<div class="slot"><div class="bulbs"></div>
      <div class="head">${w.image ? `<img src="${pic(w.image)}" alt="">` : ''}<div><div class="title">LEVEL SLOTS</div><div class="by">${esc(w.from)}</div></div></div>
      <div class="window"><div class="strip">${items.map((n, i) => `<div class="item ${n > 0 ? 'plus' : 'minus'}${i === items.length - 2 ? ' win' : ''}">${fmt(n)}</div>`).join('')}</div><div class="shade"></div><div class="band"></div></div>
      <div class="result ${w.result > 0 ? 'plus' : 'minus'}">${fmt(w.result)} LEVEL${Math.abs(w.result) === 1 ? '' : 'S'}!</div></div>`;
  box.classList.add('on');
  const strip = box.querySelector('.strip'), slot = box.querySelector('.slot'), t0 = performance.now(), dur = w.spinMs || 4500;
  const ease = t => 1 - Math.pow(1 - t, 4);
  let last = -1;
  const frame = now => {
    const t = Math.min(1, (now - t0) / dur), y = ease(t) * end, idx = Math.floor(y / H);
    strip.style.transform = `translateY(${-y}px)`;
    if (idx !== last) { last = idx; tick(1200 + (idx % 2) * 300); }
    if (t < 1) return requestAnimationFrame(frame);
    slot.classList.add('done');
    tick(w.result > 0 ? 880 : 220, 0.25, 0.2); setTimeout(() => tick(w.result > 0 ? 1320 : 165, 0.35, 0.2), 140);
    setTimeout(() => { slot.classList.add('out'); setTimeout(() => { box.classList.remove('on'); box.innerHTML = ''; slotBusy = false; if (slotQueue.length) spinSlots(slotQueue.shift()); }, 400); }, 3200);
  };
  requestAnimationFrame(frame);
}

// ----- chat block delete: the blocks chat picked, each counting down; then "STONE DELETED" -----
let cdItems = [];
function showChatDel(d) {
  cdItems = d.items || [];
  const box = document.getElementById('chatDel');
  // a countdown already on screen keeps its element, so it doesn't pop in again every second
  const have = new Map([...box.querySelectorAll('.cd[data-k]')].map(el => [el.dataset.k, el]));
  const keep = new Set();
  cdItems.forEach(it => {
    const k = it.label + '|' + it.by;
    keep.add(k);
    let el = have.get(k);
    if (!el) {
      el = document.createElement('div');
      el.className = 'cd'; el.dataset.k = k;
      el.innerHTML = `<div class="row1"><span class="name">${esc(it.label)}</span><span class="num"></span></div><div class="by">picked by ${esc(it.by)}</div><div class="bar"><i style="width:100%"></i></div>`;
      box.appendChild(el);
    }
    el.querySelector('.num').textContent = it.left + 's';
    requestAnimationFrame(() => { el.querySelector('.bar i').style.width = (it.total ? 100 * Math.max(0, it.left - 1) / it.total : 0) + '%'; });
    el.classList.toggle('urgent', it.left <= 5);
  });
  for (const [k, el] of have) if (!keep.has(k)) el.remove();
  if (d.done) {
    const el = document.createElement('div');
    el.className = 'cd gone';
    el.innerHTML = `<div class="name">${esc(d.done.label)} DELETED</div><div class="by">${d.done.failed ? 'nobody in the world' : `${Number(d.done.count || 0).toLocaleString('en-US')} blocks gone`}</div>`;
    box.prepend(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// ----- Chunk Chat: what's winning and when the chunk changes; then "STONE CHUNK!" for a few seconds -----
let ccShowDone = 0;
function showChunkChat(s) {
  const box = document.getElementById('chunkChat');
  if (!s || !s.on) { box.innerHTML = ''; return; }
  if (s.done) {
    ccShowDone = Date.now() + 4000;
    const d = s.done;
    box.innerHTML = d.none ? `<div class="cc done"><div class="block none">Nobody picked a block</div><div class="by">type a block in chat!</div></div>`
      : `<div class="cc done"><div class="tag">${esc(s.doneTag || 'YOUR CHUNK IS NOW')}</div><div class="block${d.label.length > 14 ? ' long' : ''}">${esc(d.label)}</div><div class="by">${d.failed ? "it didn't work this time" : d.by ? `picked by ${esc(d.by)}` : d.votes ? `${d.votes} vote${d.votes > 1 ? 's' : ''}` : ''}</div></div>`;
    return;
  }
  if (Date.now() < ccShowDone) return;          // keep the result up for a moment
  let el = box.querySelector('.cc:not(.done)');
  if (!el) {
    box.innerHTML = `<div class="cc"><div class="head"><span class="tag">${esc(s.tag || 'NEXT CHUNK')}</span><span class="num"></span></div><div class="block"></div><div class="by"></div><div class="bar"><i style="width:100%"></i></div><div class="top"></div></div>`;
    el = box.firstChild;
  }
  el.querySelector('.num').textContent = s.left + 's';
  const b = el.querySelector('.block');
  b.textContent = s.leader ? s.leader.label : 'Type a block in chat!';
  b.classList.toggle('none', !s.leader);
  b.classList.toggle('long', !!s.leader && s.leader.label.length > 14);
  el.querySelector('.by').textContent = !s.leader ? '' : s.leader.by ? `picked by ${s.leader.by}` : s.leader.votes ? `${s.leader.votes} vote${s.leader.votes > 1 ? 's' : ''}` : '';
  el.querySelector('.top').innerHTML = (s.top || []).slice(1).map(t => `<div><span>${esc(t.label)}</span><span>${t.votes}</span></div>`).join('');
  requestAnimationFrame(() => { el.querySelector('.bar i').style.width = (s.total ? 100 * Math.max(0, s.left - 1) / s.total : 0) + '%'; });
  el.classList.toggle('urgent', s.left <= 5);
}

// ----- Chunk Chat's reveal: the block that the chunk turned into -----
// a plain cube when Minecraft's own picture isn't there
const CUBE = '<svg viewBox="0 0 32 32"><path d="M16 3 29 9.5 16 16 3 9.5z" fill="#7fdc6a"/><path d="M3 9.5 16 16v13L3 22.5z" fill="#6b4a2c"/><path d="M29 9.5 16 16v13l13-6.5z" fill="#4e3520"/></svg>';
let revealTimer = null;
function revealHtml(d, demo) {
  const pic = `/mc/block/${encodeURIComponent(d.id || 'grass_block')}.png`, name = String(d.label || ''), long = name.length > 13;
  const bits = demo ? '' : Array.from({ length: 18 }, (_, i) => {
    const a = (i / 18) * Math.PI * 2 + Math.random() * .3, r = 170 + Math.random() * 160;
    return `<i style="--x:${(Math.cos(a) * r).toFixed(0)}px;--y:${(Math.sin(a) * r * .8 + 60).toFixed(0)}px;--r:${Math.round(Math.random() * 540 - 270)}deg;background-image:url('${pic}');background-position:${-Math.floor(Math.random() * 6) * 28}px ${-Math.floor(Math.random() * 6) * 28}px"></i>`;
  }).join('');
  const letters = [...name].map((c, i) => c === ' ' ? ' ' : `<b style="animation-delay:${(0.8 + i * 0.04).toFixed(2)}s">${esc(c)}</b>`).join('');
  const sub = [d.by ? `picked by <span>${esc(d.by)}</span>` : d.votes ? `<span>${d.votes}</span> vote${d.votes > 1 ? 's' : ''}` : '', d.count ? `<span>${Number(d.count).toLocaleString()}</span> blocks` : ''].filter(Boolean).join(' · ');
  return `<div class="rv${demo ? ' demo' : ''}"><div class="flash"></div><div class="rays"></div><div class="rings"><i></i><i></i><i></i></div>
    <div class="blk"><div class="land"><img src="${pic}" alt="" onload="this.style.opacity=1" onerror="this.closest('.rv').classList.add('noimg');this.outerHTML=CUBE"></div></div><div class="bits">${bits}</div>
    <div class="tag">THE CHUNK IS NOW</div><div class="name${long ? ' long' : ''}">${letters}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}
function showReveal(d) {
  const box = document.getElementById('ccReveal');
  clearTimeout(revealTimer);
  box.innerHTML = revealHtml(d);
  applyPlaces();
  revealTimer = setTimeout(() => { box.firstChild?.classList.add('out'); revealTimer = setTimeout(() => { box.innerHTML = ''; }, 600); }, 4600);
}

// ----- the reset countdown (the Dropper) -----
let resultTimer = null;
// the save gift floating round the middle while a reset counts down
function saveFloat(r) {
  const f = document.getElementById('saveFloat'), save = r.saveGift;
  // (not while placing the boxes, where it would cover them; and it can be turned off)
  if (EDITING || settings.overlay?.saveFloat === false) { f.innerHTML = ''; return; }
  if (r.active && save) {
    if (!f.querySelector('.card:not(.out):not(.saved)')) f.innerHTML = `<div class="loop"><div class="bob"><div class="tilt"><div class="card"><div class="glow"></div>
      ${save.image ? `<img src="${pic(save.image)}" alt="">` : ''}<div class="say">Send <b>${esc(save.name)}</b><br>to SAVE!</div><div class="secs"></div></div></div></div></div>`;
    // the countdown under it
    const secs = f.querySelector('.card:not(.out):not(.saved) .secs');
    if (secs) { const n = Math.max(0, r.secondsLeft | 0); secs.textContent = `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`; secs.classList.toggle('urgent', n <= 10); }
  } else {
    const c = f.querySelector('.card:not(.out):not(.saved)');
    if (!c) return;
    c.classList.add(r.event === 'saved' ? 'saved' : 'out');
    setTimeout(() => { if (f.contains(c)) f.innerHTML = ''; }, 950);
  }
}
function showReset(r) {
  saveFloat(r);
  const box = document.getElementById('resetBox');
  if (r.active) {
    clearTimeout(resultTimer);
    const save = r.saveGift;
    let el = box.querySelector('.reset:not(.result)');
    if (!el) {
      box.innerHTML = `<div class="reset"><div class="top"><span class="label">Reset in</span><span class="num"></span></div>
        <div class="bar"><i></i></div>
        ${save ? `<div class="save"><div class="pic">${save.image ? `<img src="${pic(save.image)}" alt="">` : ''}</div><div>Send <b>${esc(save.name)}</b> to SAVE me!</div></div>` : ''}</div>`;
      el = box.firstChild;
    }
    el.querySelector('.num').textContent = r.secondsLeft;
    el.querySelector('.bar i').style.width = (r.total ? 100 * r.secondsLeft / r.total : 0) + '%';
    el.classList.toggle('urgent', r.secondsLeft <= 10);
  } else if (['saved', 'done', 'blocked'].includes(r.event)) {
    const text = { saved: 'SAVED!', done: 'RESET!', blocked: 'BLOCKED!' }[r.event];
    const who = r.event === 'saved' ? `by ${esc(r.by)}` : r.event === 'blocked' ? `${esc(r.by)}'s reset hit a shield` : r.by ? `thanks to ${esc(r.by)}` : '';
    box.innerHTML = `<div class="reset result ${r.event === 'done' ? 'bad' : ''}"><div class="num">${text}</div>${who ? `<div class="who">${who}</div>` : ''}</div>`;
    clearTimeout(resultTimer);
    resultTimer = setTimeout(() => { box.innerHTML = ''; }, 4000);
  } else if (!r.active && r.event !== 'shield') {
    box.innerHTML = '';
  }
}

fetch('/api/overlay-state').then(r => r.json()).then(s => { settings = s.settings; applySettings(); showMenu(s.menu || []); if (s.reset && s.reset.active) showReset(s.reset); if (s.chatdel) showChatDel({ items: s.chatdel }); if (s.chunkchat) showChunkChat(s.chunkchat); });
const es = new EventSource('/api/events');
// connected / not connected, so you can tell from your streaming app
let connTimer = null, everOpen = false;
const conn = (text, bad, ms) => { const c = document.getElementById('conn'); c.textContent = text; c.className = 'show' + (bad ? ' bad' : ''); clearTimeout(connTimer); if (ms) connTimer = setTimeout(() => c.className = '', ms); };
es.onopen = () => { conn(everOpen ? 'Unbound connected again' : 'Unbound connected', false, 5000); everOpen = true; };
es.onerror = () => { setTimeout(() => { if (es.readyState !== 1) conn("Unbound isn't connected: is it open on this PC?", true, 0); }, 4000); };
es.addEventListener('settings', e => { settings = JSON.parse(e.data); applySettings(); });
es.addEventListener('state', e => { settings = JSON.parse(e.data).settings; applySettings(); });
es.addEventListener('alert', e => { const d = JSON.parse(e.data); popup(d); try { menuOnGift(d); } catch { } });
es.addEventListener('play', e => { if (settings.soundsIn === 'overlay') { const p = JSON.parse(e.data); playSound(p.file, p.volume, p); } });
es.addEventListener('stopSound', e => stopSound(JSON.parse(e.data).id));
es.addEventListener('reset', e => { if (!EDITING) showReset(JSON.parse(e.data)); });
es.addEventListener('wheel', e => spinSlots(JSON.parse(e.data)));
es.addEventListener('chatdel', e => { if (!EDITING) showChatDel(JSON.parse(e.data)); });
es.addEventListener('chunkchat', e => { if (!EDITING) showChunkChat(JSON.parse(e.data)); });
es.addEventListener('chunkreveal', e => { if (!EDITING) showReveal(JSON.parse(e.data)); });
es.addEventListener('menu', e => showMenu(JSON.parse(e.data)));

// ----- where the boxes go: each has x, y (0 = left/top edge, 100 = right/bottom edge) and a size -----
// The gift list keeps its own settings (menuX, menuY, menuScale); the others are in overlay.place.
const PLACE = {
  popups: { id: 'stack', label: 'Gift popups', def: { x: 50, y: 4 } },
  menu: { id: 'menu', label: 'Gift list', def: { x: 2, y: 50 } },
  timer: { id: 'chunkChat', label: 'Timer', def: { x: 98, y: 4 } },
  chatdel: { id: 'chatDel', label: 'Block delete list', def: { x: 98, y: 40 } },
  reset: { id: 'resetBox', label: 'Reset countdown', def: { x: 2, y: 4 } },
  reveal: { id: 'ccReveal', label: 'Chunk reveal', def: { x: 50, y: 45 } },
};
// "Size of everything" (the app's Stream overlay tab): every box bigger or smaller at once, drawn sharp at that size
const zoomOf = () => Math.max(0.5, Math.min(3, ((settings.overlay && settings.overlay.zoom) || 100) / 100));
function placeOf(k) {
  const o = (settings && settings.overlay) || {};
  const p = (o.place || {})[k] || {};
  // width / height in overlay pixels (none = the box's own size); hide = not on your stream
  const wh = { w: p.w || null, h: p.h || null, hide: k === 'menu' ? o.menu === false : !!p.hide };
  if (k === 'menu') return { x: o.menuX ?? 2, y: o.menuY ?? 50, s: o.menuScale ?? 1, ...wh };
  // popups start where the old "Popups at" setting put them
  const def = k === 'popups' ? { x: 50, y: { top: 4, middle: 50, bottom: 96 }[o.position] ?? 4 } : PLACE[k].def;
  return { x: p.x ?? def.x, y: p.y ?? def.y, s: p.s ?? (o.scale || 1), ...wh };
}
function applyPlaces() {
  for (const k in PLACE) {
    const e = document.getElementById(PLACE[k].id), p = placeOf(k);
    if (!e) continue;
    Object.assign(e.style, { position: 'fixed', left: p.x + '%', top: p.y + '%', right: 'auto', bottom: 'auto',
      transformOrigin: `${p.x}% ${p.y}%`, transform: `translate(${-p.x}%, ${-p.y}%) scale(${p.s * zoomOf()})` });
    // popups low on the screen stack upwards (newest at the bottom), so they stay on screen
    if (k === 'popups') { e.style.flexDirection = p.y > 60 ? 'column-reverse' : 'column'; e.style.width = Math.max(760, p.w || 0) + 'px'; }
    if (p.w) e.style.setProperty('--bw', p.w + 'px'); else e.style.removeProperty('--bw');
    if (p.h) e.style.setProperty('--bh', p.h + 'px'); else e.style.removeProperty('--bh');
    e.classList.toggle('boxhidden', !!p.hide);
  }
}

// ----- the editor: the app shows this page with ?edit, scaled down. Every box shows (with examples
// where there's nothing yet); drag one to move it, drag its round corner to resize it. Saved as you let go,
// and your real overlay (in LIVE Studio) moves too. -----
function setupEditor() {
  document.body.classList.add('editing');
  const demo = () => {
    if (!menuRaw.length) showMenu([{ name: 'Rose', coins: 1, does: 'Spawns a zombie' }, { name: 'Finger Heart', coins: 5, does: 'Diamond kit' }, { name: 'Doughnut', coins: 30, does: 'Lightning' }]);
    showChunkChat({ on: true, tag: 'TELEPORT IN', left: 23, total: 30, leader: { label: 'VILLAGE', votes: 3 }, top: [{ label: 'VILLAGE', votes: 3 }, { label: 'CHERRY GROVE', votes: 2 }, { label: 'SPAWNER', votes: 1 }] });
    showChatDel({ items: [{ label: 'DIAMOND ORE', by: 'a viewer', left: 12, total: 20 }] });
    showReset({ active: true, secondsLeft: 42, total: 60, saveGift: { name: 'Glowing Jellyfish' } });
    const rv = document.getElementById('ccReveal');
    if (!rv.querySelector('.rv.demo')) rv.innerHTML = revealHtml({ id: 'grass_block', label: 'GRASS BLOCK', by: 'a viewer', count: 23104 }, true);
    const stack = document.getElementById('stack');
    // an example popup of the type picked (card or burst)
    const isBurst = settings.overlay.popType === 'burst', cls = isBurst ? 'burst demo' : 'pop demo';
    stack.querySelectorAll('.demo').forEach(d => { if (d.className !== cls) d.remove(); });
    let el = stack.querySelector(isBurst ? '.burst.demo' : '.pop.demo');
    if (!el) { el = document.createElement('div'); el.className = cls; stack.prepend(el); }
    const ex = { from: 'a viewer', gift: 'Rose', count: 3, label: 'Spawns a zombie', image: DEMO_ROSE };
    const html = isBurst ? burstHtml(ex) : popHtml(ex);
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
  };
  demo(); setInterval(demo, 2000);
  const frames = {};
  for (const k in PLACE) {
    const f = document.createElement('div');
    f.className = 'edframe';
    f.innerHTML = `<b>${PLACE[k].label}</b><i title="Drag to make it all bigger or smaller"></i><u class="ew" title="Drag to make it wider or narrower"></u><u class="ns" title="Drag to make it taller or shorter"></u>`;
    document.body.appendChild(f);
    frames[k] = f;
    let start = null;
    const save = () => {
      const p = placeOf(k);
      const wh = { w: p.w ? Math.round(p.w) : null, h: p.h ? Math.round(p.h) : null };
      const body = k === 'menu' ? { menuX: +p.x.toFixed(1), menuY: +p.y.toFixed(1), menuScale: +p.s.toFixed(2), place: { menu: wh } } : { place: { [k]: { x: +p.x.toFixed(1), y: +p.y.toFixed(1), s: +p.s.toFixed(2), ...wh } } };
      fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlay: body }) });
    };
    const set = p => {
      const o = settings.overlay;
      const { hide, ...keep } = p;
      if (k === 'menu') { o.menuX = p.x; o.menuY = p.y; o.menuScale = p.s; o.place = { ...(o.place || {}), menu: { ...(o.place?.menu || {}), w: p.w, h: p.h } }; }
      else o.place = { ...(o.place || {}), [k]: { ...(o.place?.[k] || {}), ...keep } };
      applyPlaces();
    };
    f.onpointerdown = ev => {
      ev.preventDefault();
      f.setPointerCapture(ev.pointerId);
      const r = document.getElementById(PLACE[k].id).getBoundingClientRect();
      start = { mx: ev.clientX, my: ev.clientY, r, p: placeOf(k), resize: ev.target.tagName === 'I', side: ev.target.tagName === 'U' ? ev.target.className : null };
      f.classList.add('drag');
    };
    f.onpointermove = ev => {
      if (!start) return;
      const dx = ev.clientX - start.mx, dy = ev.clientY - start.my, { r, p } = start;
      if (start.side) {
        // the box's own width or height (the box is drawn at its size, so undo that for the real pixels)
        const pb = PANEL[k] ? document.querySelector(PANEL[k]) : null, pr = pb ? pb.getBoundingClientRect() : r;
        const k = p.s * zoomOf();
        if (start.side === 'ew') set({ ...p, w: Math.max(120, Math.min(1900, (start.w0 ??= (p.w || pr.width / k)) + dx / k)) });
        else set({ ...p, h: Math.max(30, Math.min(1000, (start.h0 ??= (p.h || pr.height / k)) + dy / k)) });
      } else if (start.resize) {
        const s = Math.max(0.3, Math.min(3, p.s * (r.width + dx) / r.width));
        set({ ...p, s });
      } else {
        const clamp = v => Math.max(0, Math.min(100, v));
        const sr = document.getElementById('stage').getBoundingClientRect();
        const x = clamp((r.left - sr.left + dx) / Math.max(1, sr.width - r.width) * 100), y = clamp((r.top - sr.top + dy) / Math.max(1, sr.height - r.height) * 100);
        set({ ...p, x, y });
      }
    };
    f.onpointerup = f.onpointercancel = () => { if (!start) return; start = null; f.classList.remove('drag'); save(); };
  }
  // keep each frame round its box
  const follow = () => {
    for (const k in frames) {
      const r = document.getElementById(PLACE[k].id).getBoundingClientRect(), f = frames[k];
      f.style.display = r.width ? '' : 'none';
      const hid = placeOf(k).hide;
      f.classList.toggle('off', hid); f.querySelector('b').textContent = PLACE[k].label + (hid ? ' (hidden)' : '');
      Object.assign(f.style, { left: r.left - 6 + 'px', top: r.top - 6 + 'px', width: r.width + 4 + 'px', height: r.height + 4 + 'px' });
    }
    requestAnimationFrame(follow);
  };
  follow();
}

// ----- the gift list: a page at a time (list) or a gift at a time (one at a time) -----
let menuRaw = [], menuItems = [], menuPage = 0, menuTimer = null, menuShape = '', litName = null, litTimer = null, popTimer = null;
const mo = () => (settings && settings.overlay) || {};
function sortMenu() {
  const o = mo(), by = o.menuSort || 'cheap';
  menuItems = [...menuRaw].sort((a, b) => by === 'game' ? (a.order ?? 0) - (b.order ?? 0)
    : by === 'dear' ? (b.coins ?? -1) - (a.coins ?? -1) : (a.coins ?? 1e9) - (b.coins ?? 1e9));
}
function showMenu(items) { menuRaw = Array.isArray(items) ? items : []; menuPage = 0; restartMenu(); }
function pagesOf() { const o = mo(); return o.menuStyle === 'single' ? menuItems.length : Math.ceil(menuItems.length / (o.menuRows || 7)); }
function restartMenu() {
  const o = mo();
  sortMenu();
  menuShape = [o.menuStyle, o.menuRows, o.menuSeconds, o.menuSort].join('|');
  if (menuPage >= pagesOf()) menuPage = 0;
  drawMenu();
  clearInterval(menuTimer);
  if (pagesOf() > 1) menuTimer = setInterval(() => { menuPage = (menuPage + 1) % pagesOf(); drawMenu(); }, (o.menuSeconds || 8) * 1000);
}
const hexA = (hex, a) => { const n = parseInt(String(hex || '#0a1222').slice(1), 16); return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`; };
function drawMenu() {
  const el = document.getElementById('menu'), o = mo();
  // the layout changed (style, rows, speed, order): start again
  if ([o.menuStyle, o.menuRows, o.menuSeconds, o.menuSort].join('|') !== menuShape) return restartMenu();
  const on = (o.menu !== false || EDITING) && menuItems.length > 0, single = o.menuStyle === 'single';
  el.className = (on ? 'on' : '') + (single ? ' single' : '') + (o.menu === false ? ' boxhidden' : '') + (el.classList.contains('away') ? ' away' : '') + (single && litName && menuItems[menuPage]?.name === litName ? ' lit' : '');
  const v = (k, val) => el.style.setProperty(k, val);
  v('--m-x', (o.menuX ?? 2) + '%'); v('--m-y', (o.menuY ?? 50) + '%'); v('--m-scale', o.menuScale || 1);
  v('--m-bg', hexA(o.menuBg, (o.menuBgAlpha ?? 78) / 100)); v('--m-border', o.menuBorder || '#3a4a66');
  v('--m-title', o.menuTitleColor || '#ffcf3a'); v('--m-name', o.menuNameColor || '#fff'); v('--m-price', o.menuPriceColor || '#ffcf3a'); v('--m-does', o.menuDoesColor || '#9fe7ff');
  if (!on) { el.innerHTML = ''; return; }
  const title = o.menuTitle ?? 'SEND A GIFT', price = g => o.menuShowPrice !== false && g.coins != null, does = g => o.menuShowDoes !== false && g.does;
  const head = title ? `<div class="t">${esc(title)}</div>` : '';
  if (single) {
    const g = menuItems[menuPage % menuItems.length];
    el.innerHTML = head + `<div class="one">${g.image ? `<img src="${pic(g.image)}" alt="">` : ''}<div class="nm">${esc(g.name)}</div>${price(g) ? `<div class="c">${Number(g.coins).toLocaleString()} coins</div>` : ''}${does(g) ? `<div class="d">${esc(g.does)}</div>` : ''}</div>`
      + (menuItems.length > 1 && menuItems.length <= 30 ? `<div class="dots">${menuItems.map((_, i) => `<i class="${i === menuPage ? 'on' : ''}"></i>`).join('')}</div>` : '');
    return;
  }
  const rows = o.menuRows || 7, pages = Math.ceil(menuItems.length / rows), page = menuItems.slice(menuPage * rows, (menuPage + 1) * rows);
  el.innerHTML = head + page.map(g => `<div class="row${litName === g.name ? ' lit' : ''}">${g.image ? `<img src="${pic(g.image)}" alt="">` : '<span style="width:44px"></span>'}
    <div><div class="nm">${esc(g.name)}${price(g) ? ` <span class="c">${Number(g.coins).toLocaleString()} coins</span>` : ''}</div>${does(g) ? `<div class="d">${esc(g.does)}</div>` : ''}</div></div>`).join('')
    + (pages > 1 ? `<div class="pg">${menuPage + 1} / ${pages}</div>` : '');
}
// A gift came in: light it up in the list (going to its page or card), and/or fade the list out while
// the popup shows (settings)
function menuOnGift(e) {
  const o = mo(), el = document.getElementById('menu');
  if (o.menuHideOnPopup) { el.classList.add('away'); clearTimeout(popTimer); popTimer = setTimeout(() => el.classList.remove('away'), 5000); }
  if (o.menuHighlight === false || !e || !e.gift) return;
  const i = menuItems.findIndex(g => g.name.toLowerCase() === String(e.gift).toLowerCase());
  if (i < 0) return;
  litName = menuItems[i].name;
  menuPage = o.menuStyle === 'single' ? i : Math.floor(i / (o.menuRows || 7));
  drawMenu();
  clearInterval(menuTimer);                       // stay on it a moment, then carry on cycling
  clearTimeout(litTimer);
  litTimer = setTimeout(() => { litName = null; restartMenu(); }, 4000);
}

fitStage(); reportView();
if (EDITING) setTimeout(setupEditor, 300);
</script>
